version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORTAL_API_KEY=${PORTAL_API_KEY}
    restart: unless-stopped
    # Use init to ensure proper signal handling for node
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_PORTAL_API_KEY=${VITE_PORTAL_API_KEY}
    ports:
      - "8081:80"
    restart: unless-stopped
